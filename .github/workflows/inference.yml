name : Inference & Multi-job workflow

on:
    push:
        branches: inference_branch
    
jobs:
    test_case_job:
        runs-on : ubuntu-latest
    
        steps :
            - name : Checkout repository
              uses : actions/checkout@v3

            - name : Setup python
              uses : actions/setup-python@v4
              with :
                python-version: '3.9'
            
            - name : Install requirements
              run : pip install -r requirements.txt

            - name : Run tests
              run: python -m pytest tests/test_train.py
    
    
    train_job:
        runs-on : ubuntu-latest
        needs: test_case_job

        steps :
            - name : Checkout repository
              uses : actions/checkout@v3

            - name : Setup python
              uses : actions/setup-python@v4
              with :
                python-version: '3.9'
            
            - name : Install requirements
              run : pip install -r requirements.txt

            - name : Generate trained model
              run : python src/train.py
            
            - name : Upload model
              uses : actions/upload-artifact@v4
              with :
                name : Trained_model
                path : models/model_train.pkl

    inference_job:
        
        runs-on : ubuntu-latest
        needs : train_job
            
        steps : 
            - name : Checkout repository
              uses : actions/checkout@v3
            
            - name : Setup python
              uses : actions/setup-python@v4
              with : 
                python-version: '3.9'
            
            - name : Installing requirements
              run : pip install -r requirements.txt

            - name : Downloading trained model artifact
              uses : actions/download-artifact@v4
              with :
                name : Trained_model
                path : models/

            - name : Run inference script
              run : python src/inference.py
            





    

